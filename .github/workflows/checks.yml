name: Проверка прототипа

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Go, фронтенд и ML-контракт
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Фронтенд
        run: |
          npm install -g pnpm@11.25.0
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
          pnpm --dir web test
      - name: Go и MCP
        run: |
          go vet ./...
          go test -coverprofile=backend.cover ./...
      - name: ML-контракт и общее покрытие
        run: |
          python -m pip install Flask==3.1.3 jsonschema==4.25.1 coverage==7.13.4
          python -m coverage run --source=ml -m unittest discover -s tests -v
          python -m coverage json -o coverage.json
          python scripts/coverage_report.py
          cat reports/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

  browser:
    name: Сайт в Docker с PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Собрать и запустить
        run: |
          docker compose config --quiet
          docker compose up --build --wait
          curl --fail --silent --show-error --retry 10 --retry-all-errors http://127.0.0.1:8080/api/health
      - name: Проверить сценарий на компьютере и телефоне
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
          python scripts/e2e.py --output e2e-evidence
      - name: Логи при сбое
        if: failure()
        run: docker compose logs --no-color
