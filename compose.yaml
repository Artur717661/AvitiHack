services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: buddy
      POSTGRES_USER: buddy
      POSTGRES_PASSWORD: demo-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddy -d buddy"]
      interval: 3s
      timeout: 2s
      retries: 15
    volumes:
      - database:/var/lib/postgresql/data
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://buddy:demo-local@db:5432/buddy?sslmode=disable
      BUDDY_MCP_TOKEN: ${BUDDY_MCP_TOKEN:-buddy-alpha-local-demo}
      BUDDY_PUBLIC_URL: http://127.0.0.1:8080
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  database:
